<!DOCTYPE html>
<html>
<head>

<title>AI Placement Assistant</title>

<style>

/* BACKGROUND IMAGE */

body{
margin:0;
padding:0;

font-family:Arial;

background-image:url("{{ url_for('static', filename='images/bg.jpg') }}");
background-size:cover;
background-position:center;
background-repeat:no-repeat;

display:flex;
justify-content:center;
align-items:center;

height:100vh;
}
/* BLUR OVERLAY */

body::before {

content:"";

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,0.4);

backdrop-filter: blur(6px);

z-index:-1;

}

/* CONTAINER CENTER */

.container{

max-width:600px;

background:rgba(255,255,255,0.9);

padding:25px;

border-radius:10px;

box-shadow:0 5px 20px rgba(0,0,0,0.3);

}

.container{
background:white;
padding:25px;
border-radius:10px;
max-width:700px;
margin:auto;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

textarea{
width:100%;
height:120px;
padding:10px;
}

button{
padding:10px;
background:#4CAF50;
color:white;
border:none;
cursor:pointer;
}

.answer{
background:#eef;
padding:15px;
margin-top:20px;
border-radius:5px;
}

</style>

</head>

<body>

<div class="container">

<h2>🤖 AI Placement Chatbot</h2>

<form method="POST">

<textarea name="question" placeholder="Ask anything about placements, coding, interviews..." required></textarea>

<br><br>

<button type="submit">Ask AI</button>

</form>

{% if answer %}

<div class="answer">

<h3>AI Answer:</h3>

<p>{{ answer }}</p>

</div>

{% endif %}

</div>

</body>
</html>
